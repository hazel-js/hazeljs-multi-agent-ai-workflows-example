<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HazelJS Agent Streaming Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin-bottom: 20px;
    }

    .input-section {
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .status.connected {
      background: #d4edda;
      color: #155724;
    }

    .status.streaming {
      background: #fff3cd;
      color: #856404;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status.connected .status-dot {
      background: #28a745;
    }

    .status.streaming .status-dot {
      background: #ffc107;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .metric {
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      text-align: center;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 5px;
    }

    .metric-label {
      font-size: 12px;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .response-container {
      min-height: 200px;
      max-height: 500px;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
    }

    .response-text {
      font-size: 16px;
      line-height: 1.6;
      color: #333;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: #667eea;
      animation: blink 1s infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .footer {
      text-align: center;
      color: white;
      margin-top: 30px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 HazelJS Agent Streaming</h1>
      <p>Real-time word-by-word AI responses using Server-Sent Events</p>
    </div>

    <div class="card">
      <div class="input-section">
        <div class="input-group">
          <input 
            type="text" 
            id="queryInput" 
            placeholder="Ask me anything about TypeScript, programming, or technology..."
            value="What are the key features of TypeScript 5.0?"
          >
          <button id="streamBtn" onclick="startStreaming()">Stream Response</button>
        </div>
      </div>

      <div id="status" class="status" style="display: none;">
        <span class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-value" id="tokenCount">0</div>
          <div class="metric-label">Tokens</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="duration">0.0s</div>
          <div class="metric-label">Duration</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="tokensPerSec">0</div>
          <div class="metric-label">Tokens/sec</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="stepCount">0</div>
          <div class="metric-label">Steps</div>
        </div>
      </div>

      <div class="response-container">
        <div class="response-text" id="response"></div>
      </div>
    </div>

    <div class="footer">
      <p>Powered by HazelJS • Real-time AI Agent Streaming</p>
    </div>
  </div>

  <script>
    let eventSource = null;
    let tokenCount = 0;
    let stepCount = 0;
    let startTime = 0;

    function startStreaming() {
      const query = document.getElementById('queryInput').value;
      const responseEl = document.getElementById('response');
      const statusEl = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      const streamBtn = document.getElementById('streamBtn');

      // Reset
      responseEl.textContent = '';
      tokenCount = 0;
      stepCount = 0;
      updateMetrics();

      // Disable button
      streamBtn.disabled = true;
      streamBtn.textContent = 'Streaming...';

      // Show status
      statusEl.style.display = 'flex';
      statusEl.className = 'status streaming';
      statusText.textContent = 'Connecting...';

      // Close existing connection
      if (eventSource) {
        eventSource.close();
      }

      // Create new SSE connection
      const url = `/api/stream?q=${encodeURIComponent(query)}`;
      eventSource = new EventSource(url);
      startTime = Date.now();

      eventSource.onopen = () => {
        statusText.textContent = 'Streaming response...';
      };

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          switch (data.type) {
            case 'connected':
              statusEl.className = 'status connected';
              statusText.textContent = 'Connected';
              break;

            case 'token':
              // Add token immediately - true real-time streaming!
              responseEl.textContent += data.content;
              tokenCount++;
              updateMetrics();
              
              // Auto-scroll to bottom
              responseEl.parentElement.scrollTop = responseEl.parentElement.scrollHeight;
              break;

            case 'step':
              stepCount++;
              updateMetrics();
              break;

            case 'done':
              statusEl.className = 'status connected';
              statusText.textContent = 'Complete';
              streamBtn.disabled = false;
              streamBtn.textContent = 'Stream Response';
              eventSource.close();
              break;

            case 'complete':
              console.log('Stream complete:', data);
              break;

            case 'error':
              statusEl.className = 'status error';
              statusText.textContent = `Error: ${data.error}`;
              streamBtn.disabled = false;
              streamBtn.textContent = 'Stream Response';
              eventSource.close();
              break;
          }
        } catch (error) {
          console.error('Error parsing SSE data:', error);
        }
      };

      eventSource.onerror = (error) => {
        console.error('SSE error:', error);
        statusEl.className = 'status error';
        statusText.textContent = 'Connection error';
        streamBtn.disabled = false;
        streamBtn.textContent = 'Stream Response';
        eventSource.close();
      };
    }

    function updateMetrics() {
      const elapsed = (Date.now() - startTime) / 1000;
      const tokensPerSec = elapsed > 0 ? (tokenCount / elapsed).toFixed(1) : 0;

      document.getElementById('tokenCount').textContent = tokenCount;
      document.getElementById('duration').textContent = elapsed.toFixed(1) + 's';
      document.getElementById('tokensPerSec').textContent = tokensPerSec;
      document.getElementById('stepCount').textContent = stepCount;
    }

    // Allow Enter key to submit
    document.getElementById('queryInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        startStreaming();
      }
    });
  </script>
</body>
</html>
